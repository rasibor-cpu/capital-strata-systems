<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>REA – Login</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 820px; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 16px; }
    label { display:block; margin-top: 12px; font-weight: 600; }
    input { width: 100%; padding: 10px; margin-top: 6px; box-sizing: border-box; }
    button { margin-top: 14px; padding: 10px 14px; cursor: pointer; }
    .row { display:flex; gap: 10px; flex-wrap: wrap; }
    .row button { flex: 1; }
    .muted { color: #666; font-size: 13px; }
    .ok { color: #0a7; font-weight: 700; }
    .bad { color: #c00; font-weight: 700; }
    pre { background: #f7f7f7; padding: 12px; border-radius: 8px; overflow: auto; }
    .pill { display:inline-block; padding: 2px 8px; border-radius: 999px; background:#efefef; font-size:12px; margin-left:8px; }
  </style>
</head>
<body>
  <h2>REA Capital – Trading Engine</h2>
  <p class="muted">
    Seamless login workflow:
    <span class="pill">Step 1</span> Username + Password → OTP sent to your email
    <span class="pill">Step 2</span> Enter OTP → Validate → Enter Menu
  </p>

  <div class="card">
    <label>API Base URL</label>
    <input id="baseUrl" value="http://127.0.0.1:8000" />

    <label>Username</label>
    <input id="username" value="robert" autocomplete="username" />

    <label>Password</label>
    <input id="password" type="password" value="123456" autocomplete="current-password" />

    <label>6-digit OTP (from email)</label>
    <input id="token" inputmode="numeric" maxlength="6" placeholder="Enter the 6-digit code from your email" />

    <div class="row">
      <button id="getTokenBtn">1) Send OTP</button>
      <button id="validateBtn">2) Validate & Enter</button>
      <button id="logoutBtn">Logout</button>
    </div>

    <p id="statusLine" class="muted"></p>

    <h3>Session Token (stored)</h3>
    <pre id="tokenBox">(none)</pre>

    <h3>Output</h3>
    <pre id="out">{}</pre>
  </div>

<script>
  const $ = (id) => document.getElementById(id);

  function setOut(obj) {
    $("out").textContent = typeof obj === "string" ? obj : JSON.stringify(obj, null, 2);
  }

  function setStatus(text, ok=null) {
    const el = $("statusLine");
    el.textContent = text || "";
    el.className = ok === true ? "ok" : ok === false ? "bad" : "muted";
  }

  function getStoredSessionToken() {
    return localStorage.getItem("rea_session_token") || "";
  }

  function setStoredSessionToken(t) {
    if (t) localStorage.setItem("rea_session_token", t);
    else localStorage.removeItem("rea_session_token");
    $("tokenBox").textContent = t ? t : "(none)";
  }

  setStoredSessionToken(getStoredSessionToken());

  async function readJsonSafe(res) {
    const text = await res.text().catch(() => "");
    try { return text ? JSON.parse(text) : {}; } catch { return { raw: text }; }
  }

  async function postJson(url, payload, bearer="") {
    const headers = { "Content-Type": "application/json" };
    if (bearer) headers["Authorization"] = "Bearer " + bearer;

    const res = await fetch(url, { method: "POST", headers, body: JSON.stringify(payload) });
    const data = await readJsonSafe(res);
    if (!res.ok) throw { status: res.status, statusText: res.statusText, data };
    return data;
  }

  function mustBe6Digits(x) {
    return typeof x === "string" && /^\d{6}$/.test(x);
  }

  $("getTokenBtn").onclick = async () => {
    try {
      setStatus("Sending OTP…", null);
      const base = $("baseUrl").value.trim();

      const resp = await postJson(base + "/auth/login", {
        username: $("username").value.trim(),
        password: $("password").value
      });

      setStatus(`OTP sent to: ${resp.sent_to}. Enter it below and validate.`, true);
      setOut({ ok:true, step:"login", resp });

      // NOTE: OTP is not displayed and not auto-filled.
      $("token").focus();
    } catch (e) {
      setStatus("Send OTP failed.", false);
      setOut({ ok:false, error:e });
    }
  };

  $("validateBtn").onclick = async () => {
    try {
      const base = $("baseUrl").value.trim();
      const otp = $("token").value.trim();

      if (!mustBe6Digits(otp)) {
        setStatus("OTP must be exactly 6 digits.", false);
        return;
      }

      setStatus("Validating OTP…", null);

      const verify = await postJson(base + "/auth/verify", { challenge_code: otp });

      const sessionToken = String(verify.token || "").trim();
      if (!mustBe6Digits(sessionToken)) {
        setStatus("Verify failed: session token not returned.", false);
        setOut({ ok:false, verify });
        return;
      }

      setStoredSessionToken(sessionToken);
      setStatus("Validated. Entering system…", true);
      setOut({ ok:true, step:"verify", verify });

      window.location.href = "/menu";
    } catch (e) {
      setStatus("Validate failed.", false);
      setOut({ ok:false, error:e });
    }
  };

  $("logoutBtn").onclick = async () => {
    try {
      setStoredSessionToken("");
      $("token").value = "";
      setStatus("Logged out.", true);
      setOut({ ok:true });
      window.location.href = "/login";
    } catch (e) {
      setStatus("Logout failed.", false);
      setOut({ ok:false, error:e });
    }
  };
</script>
</body>
</html>
