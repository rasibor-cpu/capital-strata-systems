<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>REA – Login</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 820px; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 16px; }
    label { display:block; margin-top: 12px; font-weight: 600; }
    input { width: 100%; padding: 10px; margin-top: 6px; box-sizing: border-box; }
    button { margin-top: 14px; padding: 10px 14px; cursor: pointer; }
    .row { display:flex; gap: 10px; flex-wrap: wrap; }
    .row button { flex: 1; }
    .muted { color: #666; font-size: 13px; }
    .ok { color: #0a7; font-weight: 700; }
    .bad { color: #c00; font-weight: 700; }
    pre { background: #f7f7f7; padding: 12px; border-radius: 8px; overflow: auto; }
    .pill { display:inline-block; padding: 2px 8px; border-radius: 999px; background:#efefef; font-size:12px; margin-left:8px; }
  </style>
</head>
<body>
  <h2>REA Capital – Trading Engine</h2>
  <p class="muted">
    Seamless login workflow:
    <span class="pill">Step 1</span> Username + Password → Get 6-digit Token
    <span class="pill">Step 2</span> Enter Token → Validate → Enter Menu
  </p>

  <div class="card">
    <label>API Base URL</label>
    <input id="baseUrl" value="http://127.0.0.1:8000" />

    <label>Username</label>
    <input id="username" value="robert" autocomplete="username" />

    <label>Password</label>
    <input id="password" type="password" value="123456" autocomplete="current-password" />

    <label>6-digit Token (issued after Step 1)</label>
    <input id="token" inputmode="numeric" maxlength="6" placeholder="e.g. 936792" />

    <div class="row">
      <button id="getTokenBtn">1) Get Token</button>
      <button id="validateBtn">2) Validate & Enter</button>
      <button id="whoamiBtn">Who am I?</button>
      <button id="logoutBtn">Logout</button>
    </div>

    <p id="statusLine" class="muted"></p>

    <h3>Session Token</h3>
    <pre id="tokenBox">(none)</pre>

    <h3>Output</h3>
    <pre id="out">{}</pre>
  </div>

<script>
  const $ = (id) => document.getElementById(id);

  function setOut(obj) {
    $("out").textContent = typeof obj === "string" ? obj : JSON.stringify(obj, null, 2);
  }

  function setStatus(text, ok=null) {
    const el = $("statusLine");
    el.textContent = text || "";
    el.className = ok === true ? "ok" : ok === false ? "bad" : "muted";
  }

  function getStoredSessionToken() {
    return localStorage.getItem("rea_session_token") || "";
  }

  function setStoredSessionToken(t) {
    if (t) localStorage.setItem("rea_session_token", t);
    else localStorage.removeItem("rea_session_token");
    $("tokenBox").textContent = t ? t : "(none)";
  }

  // init
  setStoredSessionToken(getStoredSessionToken());

  async function readJsonSafe(res) {
    const text = await res.text().catch(() => "");
    try { return text ? JSON.parse(text) : {}; } catch { return { raw: text }; }
  }

  async function postJson(url, payload, bearer="") {
    const headers = { "Content-Type": "application/json" };
    if (bearer) headers["Authorization"] = "Bearer " + bearer;

    let res;
    try {
      res = await fetch(url, { method: "POST", headers, body: JSON.stringify(payload) });
    } catch (e) {
      throw { network_error: true, message: String(e) };
    }

    const data = await readJsonSafe(res);
    if (!res.ok) throw { status: res.status, statusText: res.statusText, data };
    return data;
  }

  async function getJson(url, bearer="") {
    const headers = {};
    if (bearer) headers["Authorization"] = "Bearer " + bearer;

    let res;
    try {
      res = await fetch(url, { method: "GET", headers });
    } catch (e) {
      throw { network_error: true, message: String(e) };
    }

    const data = await readJsonSafe(res);
    if (!res.ok) throw { status: res.status, statusText: res.statusText, data };
    return data;
  }

  function mustBe6Digits(x) {
    return typeof x === "string" && /^\d{6}$/.test(x);
  }

  // STEP 1: username/password -> /auth/login -> challenge_code
  $("getTokenBtn").onclick = async () => {
    try {
      setStatus("Requesting token…", null);
      const base = $("baseUrl").value.trim();

      const resp = await postJson(base + "/auth/login", {
        username: $("username").value.trim(),
        password: $("password").value
      });

      const challenge = String(resp.challenge_code || "").trim();
      if (!mustBe6Digits(challenge)) {
        setStatus("Login OK but token not returned. Check backend response.", false);
        setOut({ ok:false, note:"Missing/invalid challenge_code", resp });
        return;
      }

      // Show token to user to type (OTP-style)
      $("token").value = challenge;

      setStatus("Token issued. Now click: Validate & Enter.", true);
      setOut({ ok:true, step:"login", challenge_code: challenge, raw: resp });
    } catch (e) {
      setStatus("Get Token failed.", false);
      setOut({ ok:false, error:e });
    }
  };

  // STEP 2: token -> /auth/verify -> session token -> store -> redirect to /menu
  $("validateBtn").onclick = async () => {
    try {
      const base = $("baseUrl").value.trim();
      const challenge = $("token").value.trim();

      if (!mustBe6Digits(challenge)) {
        setStatus("Token must be exactly 6 digits.", false);
        return;
      }

      setStatus("Validating token…", null);

      const verify = await postJson(base + "/auth/verify", { challenge_code: challenge });

      const sessionToken = String(verify.token || "").trim();
      if (!mustBe6Digits(sessionToken)) {
        setStatus("Verify failed: session token not returned.", false);
        setOut({ ok:false, note:"Missing/invalid verify.token", verify });
        return;
      }

      setStoredSessionToken(sessionToken);

      // sanity check identity
      const me = await getJson(base + "/auth/me", sessionToken);

      setStatus("Validated. Entering system…", true);
      setOut({ ok:true, step:"verify", session_token: sessionToken, me, raw: verify });

      // Seamless transition
      window.location.href = "/menu";

    } catch (e) {
      setStatus("Validate failed.", false);
      setOut({ ok:false, error:e });
    }
  };

  $("whoamiBtn").onclick = async () => {
    try {
      const base = $("baseUrl").value.trim();
      const t = getStoredSessionToken();
      if (!mustBe6Digits(t)) {
        setStatus("No valid session token stored. Login first.", false);
        return;
      }
      setStatus("Checking session…", null);
      const me = await getJson(base + "/auth/me", t);
      setStatus("Session valid.", true);
      setOut({ ok:true, me });
    } catch (e) {
      setStatus("Session invalid.", false);
      setOut({ ok:false, error:e });
    }
  };

  $("logoutBtn").onclick = async () => {
    try {
      const base = $("baseUrl").value.trim();
      const t = getStoredSessionToken();
      if (mustBe6Digits(t)) {
        // best-effort server logout
        try { await postJson(base + "/auth/logout", {}, t); } catch (_) {}
      }
      setStoredSessionToken("");
      $("token").value = "";
      setStatus("Logged out.", true);
      setOut({ ok:true });
    } catch (e) {
      setStatus("Logout failed.", false);
      setOut({ ok:false, error:e });
    }
  };
</script>
</body>
</html>
