<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>REA – Login</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 760px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 16px; }
    label { display:block; margin-top: 12px; }
    input { width: 100%; padding: 10px; margin-top: 6px; }
    button { margin-top: 14px; padding: 10px 14px; cursor: pointer; }
    pre { background: #f7f7f7; padding: 12px; border-radius: 8px; overflow: auto; }
    .row { display:flex; gap: 10px; flex-wrap: wrap; }
    .row button { flex: 1; }
    .muted { color: #666; font-size: 13px; }
    .ok { color: #0a7; font-weight: 700; }
    .bad { color: #c00; font-weight: 700; }
  </style>
</head>
<body>
  <h2>REA Capital – Trading Engine</h2>
  <p class="muted">
    Option A (Auto): Login runs a 2-step flow automatically (login → verify) and stores a 6-digit session token.
  </p>

  <div class="card">
    <label>API Base URL</label>
    <input id="baseUrl" value="http://127.0.0.1:8000" />

    <label>Username</label>
    <input id="username" value="robert" />

    <label>Password</label>
    <input id="password" type="password" value="123456" />

    <div class="row">
      <button id="loginBtn">Login (auto)</button>
      <button id="whoamiBtn">Who am I?</button>
      <button id="logoutBtn">Logout</button>
    </div>

    <p id="statusLine" class="muted"></p>

    <h3>Session Token (6 digits)</h3>
    <pre id="tokenBox">(not logged in)</pre>

    <h3>Output</h3>
    <pre id="out"></pre>
  </div>

<script>
  const $ = (id) => document.getElementById(id);

  function setOut(obj) {
    $("out").textContent = typeof obj === "string" ? obj : JSON.stringify(obj, null, 2);
  }

  function setStatus(text, ok=null) {
    const el = $("statusLine");
    el.textContent = text || "";
    el.className = ok === true ? "ok" : ok === false ? "bad" : "muted";
  }

  function getSessionToken() {
    return localStorage.getItem("rea_session_token") || "";
  }

  function setSessionToken(t) {
    if (t) localStorage.setItem("rea_session_token", t);
    else localStorage.removeItem("rea_session_token");
    $("tokenBox").textContent = t ? t : "(not logged in)";
  }

  setSessionToken(getSessionToken());

  async function readJsonSafe(res) {
    const text = await res.text().catch(() => "");
    try { return text ? JSON.parse(text) : {}; } catch { return { raw: text }; }
  }

  async function postJson(url, payload, bearer="") {
    const headers = { "Content-Type": "application/json" };
    if (bearer) headers["Authorization"] = "Bearer " + bearer;

    let res;
    try {
      res = await fetch(url, { method: "POST", headers, body: JSON.stringify(payload) });
    } catch (e) {
      throw { network_error: true, message: String(e) };
    }

    const data = await readJsonSafe(res);
    if (!res.ok) throw { status: res.status, statusText: res.statusText, data };
    return data;
  }

  async function getJson(url, bearer="") {
    const headers = {};
    if (bearer) headers["Authorization"] = "Bearer " + bearer;

    let res;
    try {
      res = await fetch(url, { method: "GET", headers });
    } catch (e) {
      throw { network_error: true, message: String(e) };
    }

    const data = await readJsonSafe(res);
    if (!res.ok) throw { status: res.status, statusText: res.statusText, data };
    return data;
  }

  // AUTO FLOW:
  // 1) POST /auth/login -> returns {challenge_code}
  // 2) POST /auth/verify -> returns {token} (session token)
  $("loginBtn").onclick = async () => {
    try {
      setStatus("Logging in…", null);
      const base = $("baseUrl").value.trim();

      const loginResp = await postJson(base + "/auth/login", {
        username: $("username").value.trim(),
        password: $("password").value
      });

      const challenge = loginResp.challenge_code;
      if (!challenge) throw { message: "No challenge_code returned from /auth/login", loginResp };

      setStatus("Verifying challenge…", null);

      const verifyResp = await postJson(base + "/auth/verify", {
        challenge_code: String(challenge).trim()
      });

      if (!verifyResp.token) throw { message: "No session token returned from /auth/verify", verifyResp };

      setSessionToken(verifyResp.token);
      setStatus("Login OK. Session token issued.", true);

      setOut({
        ok: true,
        login_step1: loginResp,
        verify_step2: verifyResp
      });
    } catch (e) {
      setStatus("Login failed.", false);
      setOut({ ok: false, error: e });
    }
  };

  $("whoamiBtn").onclick = async () => {
    try {
      setStatus("Checking session…", null);
      const base = $("baseUrl").value.trim();
      const me = await getJson(base + "/auth/me", getSessionToken());
      setStatus("Session valid.", true);
      setOut({ ok: true, me });
    } catch (e) {
      setStatus("Session invalid.", false);
      setOut({ ok: false, error: e });
    }
  };

  $("logoutBtn").onclick = async () => {
    try {
      setStatus("Logging out…", null);
      const base = $("baseUrl").value.trim();
      const resp = await postJson(base + "/auth/logout", {}, getSessionToken());
      setSessionToken("");
      setStatus("Logged out.", true);
      setOut({ ok: true, logout: resp });
    } catch (e) {
      setStatus("Logout failed.", false);
      setOut({ ok: false, error: e });
    }
  };
</script>
</body>
</html>
