# Phase 176C markers
[pytest]
norecursedirs =
    .git
    archive
    CLAUDE_FULL_SYSTEM_AUDIT
    venv
    .env
    node_modules
    css-gemini

python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
markers =
    browser: optional live Playwright browser tests (requires requirements-browser.txt + CSS_LIVE_BROWSER_BASE_URL)
    live_session: allow live css_auth_session / session bridge (disables Phase 176D test auth isolation)
