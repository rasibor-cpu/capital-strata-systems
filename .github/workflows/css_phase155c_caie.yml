name: CSS Phase 155C CAIE

on:
  push:
    branches:
      - phase-155c-caie-portfolio-optimizer-2026-09-14
    paths:
      - "backend/allocation/**"
      - "tests/test_phase155c_caie_portfolio_optimizer.py"
      - "docs/governance/PHASE_155C_CAIE_PORTFOLIO_OPTIMIZER.md"
      - ".github/workflows/css_phase155c_caie.yml"
  workflow_dispatch:

jobs:
  phase155c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile
        run: |
          python -m compileall -q backend/allocation tests/test_phase155c_caie_portfolio_optimizer.py
      - name: Phase 155C Focused Tests
        run: |
          python -m pytest -q tests/test_phase155c_caie_portfolio_optimizer.py
      - name: Full Regression
        run: |
          python -m pytest -q
