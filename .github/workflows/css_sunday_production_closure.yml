name: CSS Sunday Production Closure

on:
  pull_request:
    branches:
      - css-v1-completion-2026-09-13
    paths:
      - "backend/commercialization/**"
      - "scripts/report_css_production_closure.py"
      - "docs/production/**"
      - "tests/test_production_closure_status.py"
      - ".github/workflows/css_sunday_production_closure.yml"
  push:
    branches:
      - css-v1-completion-2026-09-13
  workflow_dispatch:

jobs:
  closure-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile Closure Controls
        run: |
          python -m compileall -q backend scripts tests
      - name: Validate Closure Status Model
        run: |
          python -m pytest -q             tests/test_production_closure_status.py             tests/test_production_evidence_handoff.py
      - name: Verify Production Request Pack
        run: |
          test -f docs/production/requests/CSS_COUNSEL_COMPLIANCE_EVIDENCE_REQUEST.md
          test -f docs/production/requests/CSS_PAYMENT_PROVIDER_EVIDENCE_REQUEST.md
          test -f docs/production/requests/CSS_NOTIFICATION_PROVIDER_EVIDENCE_REQUEST.md
          test -f docs/production/requests/CSS_SECURITY_OPERATIONS_EVIDENCE_REQUEST.md
          test -f docs/production/requests/CSS_PRODUCTION_UAT_RECONCILIATION_EVIDENCE_REQUEST.md
          test -f docs/production/requests/CSS_RELEASE_OWNER_SIGNOFF_REQUEST.md
          test -f docs/production/requests/CSS_INCIDENT_TABLETOP_EVIDENCE_PACK.md
          test -f docs/production/CSS_REAL_ENVIRONMENT_RESTORE_DRILL_RUNBOOK.md
          test -f docs/production/research/CSS_CANADA_ONTARIO_PRELIMINARY_REGULATORY_BRIEF.md
          test -f docs/production/research/CSS_PROVIDER_DECISION_BRIEF_CANADA.md
      - name: Assert Missing Evidence Remains Fail Closed
        run: |
          set +e
          python scripts/report_css_production_closure.py             --internal-engineering-complete
          code=$?
          set -e
          test "$code" -eq 2
