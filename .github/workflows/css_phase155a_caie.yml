name: CSS Phase 155A CAIE

on:
  push:
    branches:
      - phase-155a-caie-opportunity-proposal-2026-09-14
    paths:
      - "backend/allocation/**"
      - "tests/test_phase155a_opportunity_proposal.py"
      - "docs/governance/PHASE_155A_CAIE_OPPORTUNITY_PROPOSAL.md"
      - ".github/workflows/css_phase155a_caie.yml"
  workflow_dispatch:

jobs:
  phase155a:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile
        run: |
          python -m compileall -q backend/allocation tests/test_phase155a_opportunity_proposal.py
      - name: Phase 155A Focused Tests
        run: |
          python -m pytest -q tests/test_phase155a_opportunity_proposal.py
      - name: Full Regression
        run: |
          python -m pytest -q
