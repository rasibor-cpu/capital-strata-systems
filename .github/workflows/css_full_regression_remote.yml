name: CSS Full Regression Remote

on:
  push:
    branches:
      - css-phone-remote-work-2026-09-13
      - css-qro004x-integration-2026-09-13
      - css-v1-completion-2026-09-13
    paths:
      - "backend/**"
      - "dashboard/**"
      - "engine/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/css_full_regression_remote.yml"
  pull_request:
    branches:
      - css-v1-completion-2026-09-13
    paths:
      - "backend/**"
      - "dashboard/**"
      - "engine/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/css_full_regression_remote.yml"
  workflow_dispatch:

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile Primary Python Trees
        run: |
          python -m compileall -q backend dashboard engine tests
      - name: Run Full Test Suite
        run: |
          python -m pytest -q
