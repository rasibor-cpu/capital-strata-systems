name: CSS Program D Executive Command Foundation

on:
  push:
    branches:
      - program-d-executive-command-foundation-2026-09-15
    paths:
      - "backend/operations/**"
      - "tests/test_program_d_executive_command.py"
      - "docs/governance/PROGRAM_D_EXECUTIVE_COMMAND_FOUNDATION.md"
      - ".github/workflows/css_program_d_executive_command.yml"
  workflow_dispatch:

jobs:
  program-d-executive-command:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile
        run: |
          python -m compileall -q backend/operations tests/test_program_d_executive_command.py
      - name: Focused Program D Tests
        run: |
          python -m pytest -q tests/test_program_d_executive_command.py
      - name: Full Regression
        run: |
          python -m pytest -q
