name: CSS Program B Experiment Approval

on:
  push:
    branches:
      - program-b-experiment-approval-2026-09-15
    paths:
      - "backend/research/experiment_registry.py"
      - "tests/test_program_b_experiment_approval.py"
      - "docs/governance/PROGRAM_B_EXPERIMENT_APPROVAL_WORKFLOW.md"
      - ".github/workflows/css_program_b_experiment_approval.yml"
  workflow_dispatch:

jobs:
  program-b-experiment-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile
        run: |
          python -m compileall -q backend/research tests/test_program_b_experiment_approval.py
      - name: Focused Program B Tests
        run: |
          python -m pytest -q tests/test_program_b_experiment_approval.py
      - name: Full Regression
        run: |
          python -m pytest -q
