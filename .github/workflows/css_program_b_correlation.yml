name: CSS Program B Correlation

on:
  push:
    branches:
      - program-b-correlation-concentration-2026-09-15
    paths:
      - "backend/research/correlation_analysis.py"
      - "tests/test_program_b_correlation_concentration.py"
      - "docs/governance/PROGRAM_B_CORRELATION_CONCENTRATION.md"
      - ".github/workflows/css_program_b_correlation.yml"
  workflow_dispatch:

jobs:
  program-b-correlation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile
        run: |
          python -m compileall -q backend/research tests/test_program_b_correlation_concentration.py
      - name: Focused Program B Tests
        run: |
          python -m pytest -q tests/test_program_b_correlation_concentration.py
      - name: Full Regression
        run: |
          python -m pytest -q
