name: CSS Phase 155F CAIE

on:
  push:
    branches:
      - phase-155f-caie-dashboard-visibility-2026-09-14
    paths:
      - "dashboard/runtime/api_bridge.py"
      - "tests/test_phase155f_caie_dashboard_visibility.py"
      - "docs/governance/PHASE_155F_CAIE_DASHBOARD_VISIBILITY.md"
      - ".github/workflows/css_phase155f_caie.yml"
  workflow_dispatch:

jobs:
  phase155f:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile
        run: |
          python -m compileall -q dashboard/runtime/api_bridge.py tests/test_phase155f_caie_dashboard_visibility.py
      - name: Phase 155F Focused Tests
        run: |
          python -m pytest -q tests/test_phase155f_caie_dashboard_visibility.py
      - name: Full Regression
        run: |
          python -m pytest -q
