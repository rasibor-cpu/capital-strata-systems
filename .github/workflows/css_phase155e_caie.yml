name: CSS Phase 155E CAIE

on:
  push:
    branches:
      - phase-155e-caie-learning-log-2026-09-14
    paths:
      - "backend/allocation/**"
      - "tests/test_phase155e_caie_learning_log.py"
      - "docs/governance/PHASE_155E_CAIE_LEARNING_LOG.md"
      - ".github/workflows/css_phase155e_caie.yml"
  workflow_dispatch:

jobs:
  phase155e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile
        run: |
          python -m compileall -q backend/allocation tests/test_phase155e_caie_learning_log.py
      - name: Phase 155E Focused Tests
        run: |
          python -m pytest -q tests/test_phase155e_caie_learning_log.py
      - name: Full Regression
        run: |
          python -m pytest -q
