name: CSS Institutional Hardening

on:
  push:
    branches:
      - css-institutional-hardening-ph44-55
    paths:
      - "backend/institutional_hardening/**"
      - "tests/test_institutional_hardening_ph44_55.py"
      - "docs/governance/CSS_PHASE44_55_INSTITUTIONAL_HARDENING.md"
      - ".github/workflows/css_institutional_hardening.yml"
  workflow_dispatch:

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile
        run: |
          python -m compileall -q backend/institutional_hardening tests/test_institutional_hardening_ph44_55.py
      - name: Focused Tests
        run: |
          python -m pytest -q tests/test_institutional_hardening_ph44_55.py
      - name: Full Regression
        run: |
          python -m pytest -q
