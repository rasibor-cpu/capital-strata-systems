name: CSS Program B Closeout

on:
  push:
    branches:
      - program-b-research-package-closeout-2026-09-15
    paths:
      - "backend/research/research_package.py"
      - "tests/test_program_b_research_package.py"
      - "docs/governance/PROGRAM_B_RESEARCH_PORTFOLIO_INTELLIGENCE_CLOSEOUT.md"
      - ".github/workflows/css_program_b_closeout.yml"
  workflow_dispatch:

jobs:
  program-b-closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile
        run: |
          python -m compileall -q backend/research tests/test_program_b_research_package.py
      - name: Focused Program B Closeout Tests
        run: |
          python -m pytest -q tests/test_program_b_research_package.py
      - name: Program B Aggregate Tests
        run: |
          python -m pytest -q             tests/test_program_b_research_certification.py             tests/test_program_b_data_quality_benchmark.py             tests/test_program_b_correlation_concentration.py             tests/test_program_b_monte_carlo.py             tests/test_program_b_experiment_approval.py             tests/test_program_b_research_package.py
      - name: Full Regression
        run: |
          python -m pytest -q
