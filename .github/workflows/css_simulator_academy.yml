name: CSS Simulator Academy

on:
  push:
    branches:
      - css-phone-remote-work-2026-09-13
    paths:
      - "backend/simulator/**"
      - "tests/test_css_simulator_academy*.py"
      - "docs/CSS_SIMULATOR_ACADEMY_*.md"
      - ".github/workflows/css_simulator_academy.yml"
  pull_request:
    paths:
      - "backend/simulator/**"
      - "tests/test_css_simulator_academy*.py"
      - "docs/CSS_SIMULATOR_ACADEMY_*.md"
      - ".github/workflows/css_simulator_academy.yml"
  workflow_dispatch:

jobs:
  simulator-academy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Compile simulator package
        run: python -m compileall -q backend/simulator
      - name: Run simulator academy tests
        run: python -m pytest -q tests/test_css_simulator_academy.py tests/test_css_simulator_academy_progression.py tests/test_css_simulator_academy_phase3.py tests/test_css_simulator_academy_phase4.py tests/test_css_simulator_academy_phase5.py
