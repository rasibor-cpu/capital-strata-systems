name: CSS Phase 155G CAIE

on:
  push:
    branches:
      - phase-155g-caie-promotion-policy-2026-09-14
    paths:
      - "backend/allocation/caie_promotion_policy.py"
      - "tests/test_phase155g_caie_promotion_policy.py"
      - "docs/governance/PHASE_155G_CAIE_PROMOTION_POLICY.md"
      - ".github/workflows/css_phase155g_caie.yml"
  workflow_dispatch:

jobs:
  phase155g:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile
        run: |
          python -m compileall -q backend/allocation/caie_promotion_policy.py tests/test_phase155g_caie_promotion_policy.py
      - name: Phase 155G Focused Tests
        run: |
          python -m pytest -q tests/test_phase155g_caie_promotion_policy.py
      - name: Full Regression
        run: |
          python -m pytest -q
