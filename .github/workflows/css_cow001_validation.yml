name: CSS COW-001 Script Validation

on:
  push:
    branches:
      - css-cow001-evidence-hardening
    paths:
      - "scripts/ops/cow001_*.ps1"
      - "docs/certification/CSS_COW001_CONTROLLED_OPERATING_WINDOW_PLAN.md"
      - ".github/workflows/css_cow001_validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Parse PowerShell Scripts
        shell: pwsh
        run: |
          $paths = @(
            "scripts/ops/cow001_preflight.ps1",
            "scripts/ops/cow001_capture_sample.ps1",
            "scripts/ops/cow001_finalize.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "PowerShell parse failure: $path"
            }
            Write-Host "PARSE_PASS=$path"
          }
      - name: Verify Fail-Closed Safety Markers
        shell: pwsh
        run: |
          $plan = Get-Content "docs/certification/CSS_COW001_CONTROLLED_OPERATING_WINDOW_PLAN.md" -Raw
          foreach ($marker in @(
            "execution_allowed = false",
            "live_trading_blocked = true",
            "broker_execution_armed = false",
            "advisory_only = true"
          )) {
            if (-not $plan.Contains($marker)) {
              throw "Missing safety marker: $marker"
            }
          }
          Write-Host "COW001_SAFETY_MARKERS=PASS"
