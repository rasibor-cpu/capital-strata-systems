name: CSS Governance Validation

on:
  push:
    branches:
      - main
      - css-phone-remote-work-2026-09-13
      - css-qro004x-integration-2026-09-13
      - css-v1-completion-2026-09-13
  pull_request:
  workflow_dispatch:

jobs:
  css-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Display Repository Structure
        run: |
          echo "=== CSS Repository Structure ==="
          find . -maxdepth 2 -type d -print | sort

      - name: Validate Governance Instruction File
        run: |
          echo "Checking Codex governance instructions..."
          if [ ! -f ".codex-instructions.md" ]; then
            echo "ERROR: .codex-instructions.md missing"
            exit 1
          fi
          echo "Governance instruction file present."

      - name: Python Syntax Validation
        run: |
          echo "Running Python compile validation..."
          python -m compileall -q backend dashboard engine tests

      - name: Governance Success Banner
        run: |
          echo "======================================="
          echo " CSS GOVERNANCE VALIDATION PASSED "
          echo " PCNRASS STATUS: STABLE "
          echo "======================================="
