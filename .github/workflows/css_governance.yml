name: CSS Governance Validation

# AR-016 / RB-011: fail-closed Gate-2 CI (replaces structurally broken prior workflow).
# Automated production deploy is NOT performed by this workflow.

on:
  push:
    branches:
      - main
      - css-unified-consolidation-2026-07-13
  pull_request:
    branches:
      - main
      - css-unified-consolidation-2026-07-13
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Governance Instruction File
        run: |
          if [ ! -f ".codex-instructions.md" ]; then
            echo "ERROR: .codex-instructions.md missing"
            exit 1
          fi
          echo "Governance instruction file present."

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Python Syntax Validation (scoped)
        run: python -m compileall -q backend dashboard launcher scripts
        env:
          PYTHONPATH: .

      - name: Bounded Gate-2 regression
        run: |
          python -m pytest \
            tests/test_wave4_product_honesty.py \
            tests/test_wave3_evidence_machine.py \
            tests/test_wave2_security_broker_integrity.py \
            tests/test_batch1_deployment_honesty.py \
            tests/test_batch2_certification_evidence.py \
            tests/test_phase181_production_readiness_certification.py \
            tests/test_certification_engine.py \
            -q --tb=line
        env:
          PYTHONPATH: .
          CSS_CERTIFICATION_PROFILE: fixture_lab

      - name: CI posture (no automated deploy claim)
        run: |
          python -c "from backend.product_honesty import deployment_honesty_status; s=deployment_honesty_status(); assert s['automated_production_deploy'] is False; print(s['customer_banner'])"
        env:
          PYTHONPATH: .
