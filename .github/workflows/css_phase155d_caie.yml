name: CSS Phase 155D CAIE

on:
  push:
    branches:
      - phase-155d-caie-runtime-shadow-2026-09-14
    paths:
      - "backend/allocation/**"
      - "dashboard/runtime/caie_shadow_bridge.py"
      - "tests/test_phase155d_caie_shadow_adapter.py"
      - "docs/governance/PHASE_155D_CAIE_SHADOW_INTEGRATION.md"
      - ".github/workflows/css_phase155d_caie.yml"
  workflow_dispatch:

jobs:
  phase155d:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile
        run: |
          python -m compileall -q backend/allocation dashboard/runtime/caie_shadow_bridge.py tests/test_phase155d_caie_shadow_adapter.py
      - name: Phase 155D Focused Tests
        run: |
          python -m pytest -q tests/test_phase155d_caie_shadow_adapter.py
      - name: Full Regression
        run: |
          python -m pytest -q
